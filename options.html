<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tab Bag — Settings</title>
  <style>
    /* ── CSS variables per theme ── */
    :root {
      --bg: #1a1a1a;
      --surface: #2b2b2b;
      --border: #404040;
      --text: #e0e0e0;
      --text-muted: #808080;
      --accent: #4CAF50;
      --accent-dark: #2c5530;
      --accent-hover: #367d3c;
      --btn-bg: #1a1a1a;
    }
    [data-theme="light"] {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --border: #d0d0d0;
      --text: #1a1a1a;
      --text-muted: #666666;
      --accent: #2e7d32;
      --accent-dark: #c8e6c9;
      --accent-hover: #388e3c;
      --btn-bg: #eeeeee;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-width: 420px;
      max-width: 540px;
      margin: 40px auto;
      padding: 0 20px 40px;
      font-family: Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.2s, color 0.2s;
    }
    h1 {
      font-size: 18px;
      font-weight: bold;
      color: var(--accent);
      margin-bottom: 24px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .section {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 14px;
    }
    .setting-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .setting-item:last-child { margin-bottom: 0; }
    .setting-item label {
      flex: 1;
      font-size: 14px;
    }
    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: var(--accent);
    }
    .lang-group, .theme-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .lang-btn {
      padding: 5px 14px;
      font-size: 13px;
      background-color: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .lang-btn.active {
      background-color: var(--accent-dark);
      border-color: var(--accent);
      color: var(--text);
    }
    [data-theme="light"] .lang-btn.active { color: #1a1a1a; }
    .lang-btn:hover:not(.active) { background-color: var(--border); }
    .volume-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .volume-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .volume-value {
      min-width: 38px;
      text-align: right;
      font-size: 13px;
      color: var(--accent);
    }
    .save-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
    }
    .btn-save {
      padding: 9px 22px;
      background-color: var(--accent-dark);
      color: var(--text);
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    [data-theme="light"] .btn-save { color: #1a1a1a; }
    .btn-save:hover { background-color: var(--accent-hover); }
    .saved-msg {
      font-size: 13px;
      color: var(--accent);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .saved-msg.show { opacity: 1; }
    .github-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
      padding: 4px 0;
    }
    .github-link:hover { text-decoration: underline; }
    .github-icon { opacity: 0.8; }
  </style>
</head>
<body>
  <h1 id="pageTitle">Tab Bag — Settings</h1>

  <!-- Language -->
  <div class="section">
    <div class="section-title" id="sectionLang">Language</div>
    <div class="setting-item">
      <div class="lang-group">
        <button class="lang-btn active" id="langEN" data-lang="en">English</button>
        <button class="lang-btn" id="langRU" data-lang="ru">Русский</button>
      </div>
    </div>
  </div>

  <!-- Theme -->
  <div class="section">
    <div class="section-title" id="sectionTheme">Theme</div>
    <div class="setting-item">
      <label id="labelTheme">Color theme:</label>
      <div class="theme-group">
        <button class="lang-btn" id="themeDark" data-theme-val="dark">Dark</button>
        <button class="lang-btn" id="themeLight" data-theme-val="light">Light</button>
        <button class="lang-btn active" id="themeSystem" data-theme-val="system">System</button>
      </div>
    </div>
  </div>

  <!-- Interface -->
  <div class="section">
    <div class="section-title" id="sectionInterface">Interface</div>
    <div class="setting-item">
      <label for="showStats" id="labelShowStats">Show tab statistics (open tab count)</label>
      <input type="checkbox" id="showStats" checked>
    </div>
  </div>

  <!-- Sound -->
  <div class="section">
    <div class="section-title" id="sectionSound">Sound</div>
    <div class="setting-item">
      <label for="soundEnabled" id="labelSoundEnabled">Play sound on errors</label>
      <input type="checkbox" id="soundEnabled">
    </div>
    <div class="setting-item">
      <label id="labelVolume">Volume</label>
      <div class="volume-row" style="flex:1">
        <input type="range" id="volume" min="0" max="100" value="80">
        <span class="volume-value" id="volumeDisplay">80%</span>
      </div>
    </div>
    <div class="setting-item" style="margin-top:6px">
      <button class="lang-btn" id="testSound" style="padding:5px 12px;font-size:12px">🔊 Test</button>
    </div>
  </div>

  <!-- GitHub link -->
  <div class="section">
    <div class="setting-item">
      <a href="https://github.com/bogfaust/tab-bag" target="_blank" class="github-link" id="githubLink">
        <svg class="github-icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        <span>GitHub / Help</span>
      </a>
    </div>
  </div>

  <div class="save-bar">
    <button class="btn-save" id="saveBtn">Save</button>
    <span class="saved-msg" id="savedMsg">Saved!</span>
  </div>

  <script src="options.js"></script>
</body>
</html>
