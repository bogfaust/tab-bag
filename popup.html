<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 400px;
      padding: 15px;
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
      color: #e0e0e0;
    }
    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
    }
    .btn-settings {
      background: none;
      border: 1px solid #404040;
      border-radius: 4px;
      color: #808080;
      font-size: 12px;
      padding: 3px 9px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
      width: auto;
    }
    .btn-settings:hover { color: #e0e0e0; border-color: #666; }
    .button-group {
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    button {
      padding: 8px 12px;
      background-color: #2c5530;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      width: 100%;
      text-align: center;
    }
    button:hover { background-color: #367d3c; }
    button.stop { background-color: #853232; }
    button.stop:hover { background-color: #a04141; }
    textarea {
      width: 100%;
      height: 200px;
      margin: 10px 0;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #404040;
      border-radius: 4px;
      resize: vertical;
      background-color: #2b2b2b;
      color: #e0e0e0;
    }
    textarea::placeholder { color: #808080; }
    textarea:focus { outline: none; border-color: #367d3c; }
    .status { margin-top: 10px; color: #808080; }
    .status.error { color: #e57373; }
    .info-panel {
      margin-top: 10px;
      padding: 10px;
      background-color: #2b2b2b;
      border-radius: 4px;
      border: 1px solid #404040;
    }
    .tabs-info { color: #4CAF50; font-weight: bold; }
    .settings-panel {
      margin: 10px 0;
      padding: 10px;
      background-color: #2b2b2b;
      border-radius: 4px;
      border: 1px solid #404040;
    }
    .setting-item {
      margin: 8px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="number"] {
      background-color: #1a1a1a;
      border: 1px solid #404040;
      color: #e0e0e0;
      padding: 4px 8px;
      border-radius: 4px;
      width: 100px;
    }
    input[type="checkbox"] { margin: 0; accent-color: #4CAF50; }
  </style>
</head>
<body>
  <div class="top-bar">
    <button class="btn-settings" id="openSettings">⚙ Settings</button>
  </div>
  <div class="button-group">
    <button id="collectUrls">Collect tab URLs</button>
    <button id="collectSelectedUrls">Collect selected tabs</button>
    <button id="openUrls">Open URLs in new tabs</button>
  </div>
  <div class="settings-panel">
    <div class="setting-item">
      <input type="checkbox" id="skipDuplicates" checked>
      <label for="skipDuplicates" id="labelSkipDuplicates">Skip duplicate URLs</label>
    </div>
    <div class="setting-item">
      <label for="delay" id="labelDelay">Delay between opening tabs (ms):</label>
      <input type="number" id="delay" value="0" min="0" step="100">
    </div>
  </div>
  <textarea id="urlList" placeholder="Enter URLs (one per line)"></textarea>
  <div class="info-panel">
    <div id="statsTitle">Stats:</div>
    <div id="tabsInfo" class="tabs-info">Open tabs: 0</div>
  </div>
  <div id="status" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
