<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tab Bag — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-width: 420px;
      max-width: 540px;
      margin: 40px auto;
      padding: 0 20px 40px;
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
      color: #e0e0e0;
    }
    h1 {
      font-size: 18px;
      font-weight: bold;
      color: #4CAF50;
      margin-bottom: 24px;
      padding-bottom: 10px;
      border-bottom: 1px solid #333;
    }
    .section {
      background-color: #2b2b2b;
      border: 1px solid #404040;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #808080;
      margin-bottom: 14px;
    }
    .setting-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .setting-item:last-child { margin-bottom: 0; }
    .setting-item label {
      flex: 1;
      font-size: 14px;
    }
    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #4CAF50;
    }
    .lang-group {
      display: flex;
      gap: 6px;
    }
    .lang-btn {
      padding: 5px 14px;
      font-size: 13px;
      background-color: #1a1a1a;
      border: 1px solid #404040;
      border-radius: 4px;
      color: #e0e0e0;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .lang-btn.active {
      background-color: #2c5530;
      border-color: #4CAF50;
      color: #fff;
    }
    .lang-btn:hover:not(.active) { background-color: #333; }
    .volume-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .volume-row input[type="range"] {
      flex: 1;
      accent-color: #4CAF50;
      cursor: pointer;
    }
    .volume-value {
      min-width: 38px;
      text-align: right;
      font-size: 13px;
      color: #4CAF50;
    }
    .save-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
    }
    .btn-save {
      padding: 9px 22px;
      background-color: #2c5530;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-save:hover { background-color: #367d3c; }
    .saved-msg {
      font-size: 13px;
      color: #4CAF50;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .saved-msg.show { opacity: 1; }
  </style>
</head>
<body>
  <h1 id="pageTitle">Tab Bag — Settings</h1>

  <div class="section">
    <div class="section-title" id="sectionLang">Language</div>
    <div class="setting-item">
      <div class="lang-group">
        <button class="lang-btn active" id="langEN" data-lang="en">English</button>
        <button class="lang-btn" id="langRU" data-lang="ru">Русский</button>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title" id="sectionSound">Sound</div>
    <div class="setting-item">
      <label for="soundEnabled" id="labelSoundEnabled">Play sound on errors</label>
      <input type="checkbox" id="soundEnabled">
    </div>
    <div class="setting-item">
      <label id="labelVolume">Volume</label>
      <div class="volume-row" style="flex:1">
        <input type="range" id="volume" min="0" max="100" value="80">
        <span class="volume-value" id="volumeDisplay">80%</span>
      </div>
    </div>
    <div class="setting-item" style="margin-top:6px">
      <button class="lang-btn" id="testSound" style="padding:5px 12px;font-size:12px">🔊 Test</button>
    </div>
  </div>

  <div class="save-bar">
    <button class="btn-save" id="saveBtn">Save</button>
    <span class="saved-msg" id="savedMsg">Saved!</span>
  </div>

  <script src="options.js"></script>
</body>
</html>
